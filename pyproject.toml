[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-critical-systems-lab"
version = "0.1.0"
description = "Maintenance predictive de systemes critiques (NASA C-MAPSS) : ML supervise, non supervise et deep learning (Python, scikit-learn, PyTorch)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
